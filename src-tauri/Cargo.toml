[package]
name = "whiteboard"
version = "0.1.0"
description = "Desktop shell for the Whiteboard dashboard"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
