[project]
name = "blackboard-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ethan-phillips26", email = "ethanphillips2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp[cli]>=2.1.1",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]

[project.scripts]
blackboard-mcp = "blackboard_mcp.server:main"
blackboard-web = "blackboard_web.app:main"
